[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packing-fem"
version = "0.1.0"
description = "Periodic unbonded and sintered sphere packing compression with solid FEM"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "gmsh==4.15.2", "matplotlib==3.11.2", "meshio==5.3.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
packing-fem = "packing_fem.cli:main"

[tool.setuptools.packages.find]
include = ["packing_fem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
